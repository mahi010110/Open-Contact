# OpenContact — intégration continue.
# Quatre signaux séparés, du plus rapide au plus complet :
#  · pwa        : les auto-tests unitaires (?test) dans un vrai Chromium ;
#  · transport  : la sonde des relais Nostr publics réellement choisis par
#                 l'app — la CI rougit si le transport public est mort (#14) ;
#  · ordinateur  : cargo test --locked + build release du binaire natif ;
#  · scenarios  : la suite de bout en bout entière (tests/e2e/tous.mjs),
#                 scénarios natifs compris — elle reconstruit le binaire
#                 et le pilote sous xvfb, comme en développement ; la
#                 liaison P2P y est jouée avec deux vrais navigateurs et
#                 un relais Nostr local (e2e-liaison.mjs).
# Aucun secret requis : tout tourne contre des doubles locaux, sauf la
# sonde transport qui parle volontairement au monde réel.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1,4'   # lundi & jeudi : le transport public se surveille même sans commit

jobs:
  transport:
    name: Transport public — relais joignables
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium
        run: |
          npm i -g playwright
          playwright install --with-deps chromium
          echo "OC_PLAYWRIGHT=$(npm root -g)/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Sonde des relais réellement choisis par l'app (lecture)
        run: OC_SONDE_RELAIS=1 node tests/e2e/sonde-relais-publics.mjs
      # La lecture ne suffit pas : la découverte a besoin d'une ÉCRITURE.
      # Un relais qui répond EOSE et refuse les publications rend
      # « En attente de ton groupe » à l'infini — voir l'en-tête de la sonde.
      - name: Sonde de découverte — deux vrais pairs par relais (écriture)
        run: OC_SONDE_RELAIS=1 node tests/e2e/sonde-decouverte-relais.mjs
      # Le contraste rapporté à l'usage : le partage en groupe passe, le
      # rendez-vous QR reste sur « En attente ». Les deux chemins joués
      # dans la même page contre les VRAIS relais, le groupe en témoin.
      - name: Sonde rendez-vous QR vs partage en groupe (vrais relais)
        run: OC_SONDE_RELAIS=1 node tests/e2e/sonde-rdv-reel.mjs
      # La découverte ne suffit pas ENTRE DEUX RÉSEAUX : la réponse part
      # sans adresse, ses candidats ICE suivent un par un par un seul
      # relais. Les sondes ci-dessus font tourner les deux pairs sur la
      # même machine, où ces candidats ne servent à rien — elles ne
      # peuvent donc pas voir un relais qui les perd. Informative : elle
      # relève, elle ne fait pas rougir la CI sur un seuil de débit tiers.
      - name: Sonde des candidats ICE — arrivent-ils de l'autre côté ?
        continue-on-error: true
        timeout-minutes: 10
        run: OC_SONDE_RELAIS=1 node tests/e2e/sonde-candidats-relais.mjs
      # Quand AUCUN chemin direct n'existe, les fiches du rendez-vous
      # passent par les relais eux-mêmes (engine/portage.js). La taille
      # d'une part et le rythme d'envoi se MESURENT ici, relais par relais.
      - name: Sonde du portage — taille et rafale que les relais portent
        continue-on-error: true
        timeout-minutes: 6
        run: OC_SONDE_RELAIS=1 node tests/e2e/sonde-portage-relais.mjs

  # DEUX MACHINES, DEUX RÉSEAUX, LA VRAIE CHAÎNE — à la main seulement.
  # Deux jobs = deux VM, deux adresses publiques, deux NAT : l'app telle
  # que livrée, les vrais relais, les vrais STUN. Chacune journalise sa
  # négociation, le bilan croise les deux et dit où la liaison s'arrête.
  # Le monde réel ne se rejoue pas à chaque poussée : il se mesure quand
  # on cherche une panne.
  deux-machines:
    name: P2P entre deux machines — paire ${{ matrix.paire }} ${{ matrix.role }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        role: [A, B]
        paire: [vieilli-1, vieilli-2, vieilli-3, webkit-vieilli]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium (et WebKit pour la paire qui le demande)
        run: |
          npm i -g playwright
          playwright install --with-deps chromium
          case "${{ matrix.paire }}" in webkit-*) playwright install --with-deps webkit ;; esac
          echo "OC_PLAYWRIGHT=$(npm root -g)/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Une machine, la vraie app, les vrais relais
        run: |
          case "${{ matrix.paire }}" in sans-damus-*) export OC_SANS_RELAIS=relay.damus.io ;; esac
          # B arrive une minute après A, comme un camarade qui sort son téléphone
          case "${{ matrix.paire }}" in *attente*) [ "${{ matrix.role }}" = B ] && export OC_DELAI_MS=60000 ;; esac
          # les DEUX réserves d'offres périmées : quel que soit l'offreur, son offre a plus de 57 s
          case "${{ matrix.paire }}" in *vieilli*) export OC_VIEILLIR_MS=65000 ;; esac
          # le moteur de l'iPhone côté B
          case "${{ matrix.paire }}" in webkit-*) [ "${{ matrix.role }}" = B ] && export OC_NAVIGATEUR=webkit ;; esac
          OC_ROLE=${{ matrix.role }} OC_SALLE=${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.paire }} node tests/e2e/sonde-deux-machines.mjs
          mkdir -p j && mv journal-${{ matrix.role }}.json j/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-${{ matrix.paire }}-${{ matrix.role }}
          path: j/journal-${{ matrix.role }}.json

  deux-machines-bilan:
    name: P2P entre deux machines — bilan
    needs: deux-machines
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: journal-*
      - name: Les deux journaux croisés, paire par paire
        run: |
          for p in vieilli-1 vieilli-2 vieilli-3 webkit-vieilli; do
            echo; echo "################ PAIRE $p ################"
            node tests/e2e/sonde-deux-machines.mjs --bilan journal-$p-A/journal-A.json journal-$p-B/journal-B.json || true
          done

  # LE RENDEZ-VOUS QR EN PERSONNE, entre deux machines — à la main seulement.
  # A « Donner → En personne » (gros lot : le QR devient un rendez-vous P2P),
  # B « Recevoir → En personne » 20 s plus tard, tape le code. Les deux se
  # calent sur une heure commune fixée par le premier job.
  rendez-vous-horloge:
    name: Rendez-vous QR — l'heure commune
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      t0: ${{ steps.h.outputs.t0 }}
    steps:
      - id: h
        run: echo "t0=$(( ($(date +%s) + 240) * 1000 ))" >> "$GITHUB_OUTPUT"

  rendez-vous:
    name: Rendez-vous QR — ${{ matrix.paire }} ${{ matrix.role }}
    needs: rendez-vous-horloge
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        role: [A, B]
        # « sans-direct » : aucun candidat ICE n'entre — le NAT d'opérateur.
        # Les fiches ne peuvent passer que par les relais (portage).
        paire: [rdv-1, rdv-webkit-recoit, sans-direct-1, sans-direct-2, sans-direct-webkit-recoit, sans-direct-webkit-donne]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium + WebKit
        run: |
          npm i -g playwright
          playwright install --with-deps chromium webkit
          echo "OC_PLAYWRIGHT=$(npm root -g)/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Le rendez-vous, une moitié par machine
        run: |
          case "${{ matrix.paire }}/${{ matrix.role }}" in
            *webkit-recoit/B|*webkit-donne/A) export OC_NAVIGATEUR=webkit ;;
          esac
          case "${{ matrix.paire }}" in sans-direct*) export OC_SANS_DIRECT=1 ;; esac
          OC_PARCOURS=rdv OC_ROLE=${{ matrix.role }} OC_T0=${{ needs.rendez-vous-horloge.outputs.t0 }} \
            OC_SALLE=${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.paire }} OC_DELAI_RECEVEUR_MS=20000 \
            node tests/e2e/sonde-deux-machines.mjs
          mkdir -p j && mv journal-${{ matrix.role }}.json j/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rdv-${{ matrix.paire }}-${{ matrix.role }}
          path: j/journal-${{ matrix.role }}.json

  rendez-vous-bilan:
    name: Rendez-vous QR — bilan
    needs: rendez-vous
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: rdv-*
      - name: Les deux moitiés croisées, paire par paire
        run: |
          for p in rdv-1 rdv-2 rdv-webkit-recoit rdv-webkit-donne; do
            echo; echo "################ $p ################"
            node tests/e2e/sonde-deux-machines.mjs --bilan rdv-$p-A/journal-A.json rdv-$p-B/journal-B.json || true
          done

  pwa:
    name: PWA — auto-tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium
        run: |
          npm i -g playwright
          playwright install --with-deps chromium
          echo "OC_PLAYWRIGHT=$(npm root -g)/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Auto-tests (?test)
        run: node tests/e2e/unitaires.mjs

  ordinateur:
    name: Ordinateur — cargo test + build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dépendances système Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: natif
      - name: Moteur partagé (preparer.mjs)
        run: node natif/preparer.mjs
      - name: Tests Rust (cœur + coquille)
        run: cargo test --locked --manifest-path natif/Cargo.toml
      - name: Build release du binaire
        run: cargo build --locked --release -p oc-natif --manifest-path natif/Cargo.toml

  scenarios:
    name: Bout en bout — suite complète (vrai binaire)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium
        run: |
          npm i -g playwright
          playwright install --with-deps chromium
          echo "OC_PLAYWRIGHT=$(npm root -g)/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Dépendances système Tauri + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev \
            xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: natif
      - name: Moteur partagé (preparer.mjs)
        run: node natif/preparer.mjs
      - name: Suite complète (unitaires + scénarios, natifs compris)
        run: node tests/e2e/tous.mjs
      - name: Captures d'écran des scénarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: tests/e2e/captures/
          if-no-files-found: ignore
