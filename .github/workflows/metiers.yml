# OpenContact — la table des métiers (lot R9-b).
# Une sonde qui relève le ROME 4.0 et le RNCP sur data.gouv.fr, et le
# script qui en tire la table embarquée (engine/metiers-donnees.js).
# À part de la CI : elle ne joue que quand l'un d'eux change, et à la
# demande. Elle parle au monde réel ; l'app, jamais (invariant ④).
name: Métiers

on:
  push:
    paths:
      - 'tests/e2e/sonde-metiers.mjs'
      - 'outils/metiers.mjs'
      - '.github/workflows/metiers.yml'
  workflow_dispatch:

jobs:
  sonde:
    name: Métiers — ROME et RNCP relevés
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Relever le ROME et le RNCP
        run: node tests/e2e/sonde-metiers.mjs
